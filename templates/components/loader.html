{% load static %}

<!-- ThemeHaven Intro Loader (Larger Scale | 2s | Refresh Only) -->
<div
  id="themehaven-loader"
  aria-label="Loading ThemeHaven"
  role="status"
  style="position: fixed; inset: 0; z-index: 999999; background-color: var(--bg-primary, #0c0913); opacity: 1; visibility: visible; transition: opacity 0.35s ease-out, visibility 0.35s ease-out;"
  class="fixed inset-0 z-[999999] flex items-center justify-center bg-[var(--bg-primary,#0c0913)] opacity-100 visible transition-all duration-300 ease-out"
>
  <div
    style="max-width: 420px; width: 100%; padding: 44px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;"
    class="flex w-full max-w-[420px] flex-col items-center justify-center px-8 py-11 text-center"
  >
    <!-- Larger Brand Block -->
    <div
      style="display: flex; align-items: center; justify-content: center; gap: 14px; min-width: 0;"
      class="flex min-w-0 items-center justify-center gap-3 sm:gap-3.5"
    >
      <img
        src="{% static 'img/logo.png' %}"
        alt="ThemeHaven"
        style="width: 72px; height: 40px; object-fit: contain; flex-shrink: 0;"
        class="h-[34px] w-[60px] shrink-0 object-contain sm:h-[40px] sm:w-[72px]"
      />
      <span
        style="font-size: 28px; font-weight: 800; letter-spacing: -0.7px; color: var(--text-primary, #ffffff); white-space: nowrap;"
        class="whitespace-nowrap text-[24px] font-extrabold tracking-[-0.6px] text-[var(--text-primary,#ffffff)] sm:text-[28px] sm:tracking-[-0.7px]"
      >
        ThemeHaven
      </span>
    </div>

    <!-- Larger 0 to 100% Progress Bar & Counter Below Brand -->
    <div style="width: 280px; max-width: 100%; margin-top: 26px;" class="mt-6 w-[280px] max-w-full">
      <div
        style="width: 100%; height: 6px; border-radius: 9999px; overflow: hidden; background-color: rgba(150, 130, 180, 0.2);"
        class="h-1.5 w-full overflow-hidden rounded-full bg-purple-500/20"
      >
        <div
          id="loader-progress-fill"
          style="width: 0%; height: 100%; border-radius: 9999px; background-color: var(--accent, #a855f7); transition: width 40ms linear;"
          class="h-full w-0 rounded-full bg-purple-500 transition-[width] duration-75 ease-linear"
        ></div>
      </div>

      <div
        style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text-muted, #9ca3af);"
        class="mt-2.5 flex items-center justify-between text-[13px] font-medium text-[var(--text-muted,#9ca3af)]"
      >
        <span>Loading</span>
        <span
          id="loader-percent"
          style="font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; color: var(--text-primary, #ffffff);"
          class="font-bold tabular-nums text-[14px] text-[var(--text-primary,#ffffff)]"
        >
          0%
        </span>
      </div>
    </div>

    <!-- Larger Caption -->
  </div>
</div>

<script>
  (() => {
    const loader = document.getElementById("themehaven-loader");
    const progressFill = document.getElementById("loader-progress-fill");
    const percentText = document.getElementById("loader-percent");
    if (!loader) return;

    const RELOAD_FLAG = "themehaven_refresh_pending";
    const DURATION_MS = 2000; // 2 seconds

    const markPending = () => {
      try {
        sessionStorage.setItem(RELOAD_FLAG, "1");
      } catch (e) {}
    };

    window.addEventListener("beforeunload", markPending);
    window.addEventListener("pagehide", markPending);

    document.addEventListener("click", (event) => {
      const link = event.target.closest("a[href]");
      if (!link) return;

      const href = link.getAttribute("href");
      if (
        !href ||
        href.startsWith("#") ||
        href.startsWith("javascript:") ||
        link.target === "_blank" ||
        event.metaKey ||
        event.ctrlKey ||
        event.shiftKey ||
        event.altKey
      ) {
        return;
      }

      try {
        const url = new URL(href, window.location.origin);
        if (url.origin === window.location.origin) {
          sessionStorage.removeItem(RELOAD_FLAG);
        }
      } catch (e) {}
    });

    const navEntry =
      performance.getEntriesByType &&
      performance.getEntriesByType("navigation")[0];
    const isReloadNav = navEntry ? navEntry.type === "reload" : false;
    let hadPendingFlag = false;

    try {
      hadPendingFlag = sessionStorage.getItem(RELOAD_FLAG) === "1";
      sessionStorage.removeItem(RELOAD_FLAG);
    } catch (e) {}

    const shouldShowLoader = isReloadNav || hadPendingFlag;

    const removeImmediately = () => {
      loader.remove();
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
    };

    if (!shouldShowLoader) {
      removeImmediately();
      return;
    }

    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";

    let dismissed = false;
    const startTime = performance.now();

    const setProgress = (value) => {
      const clamped = Math.max(0, Math.min(100, Math.round(value)));
      if (progressFill) {
        progressFill.style.width = `${clamped}%`;
      }
      if (percentText) {
        percentText.textContent = `${clamped}%`;
      }
    };

    const hideLoader = () => {
      if (dismissed) return;
      dismissed = true;
      setProgress(100);

      loader.style.opacity = "0";
      loader.style.visibility = "hidden";
      loader.style.pointerEvents = "none";
      loader.classList.add("opacity-0", "invisible", "pointer-events-none");

      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";

      setTimeout(() => {
        loader.remove();
      }, 350);
    };

    const tick = (now) => {
      if (dismissed) return;
      const elapsed = now - startTime;
      const progress = (elapsed / DURATION_MS) * 100;

      if (progress < 100) {
        setProgress(progress);
        requestAnimationFrame(tick);
      } else {
        setProgress(100);
        hideLoader();
      }
    };

    requestAnimationFrame(tick);

    // Safety fallback
    setTimeout(hideLoader, DURATION_MS + 1000);
  })();
</script>
