{% load static %}
<nav id="themehub-navbar" class="sticky top-0 z-50 w-full bg-[var(--header-bg)]">
  <div class="mx-auto grid h-[76px] max-w-[1456px] grid-cols-[1fr_auto] items-center gap-4 px-5 sm:px-8 xl:grid-cols-[295px_auto_1fr] xl:pl-10 xl:pr-8 2xl:pr-0">
    <a href="{% url 'home' %}" aria-label="ThemeHaven home" class="flex min-w-0 items-center gap-2.5 justify-self-start">
      <img src="{% static 'img/logo.png' %}" alt="" class="h-[30px] w-[54px] shrink-0 object-contain" />
      <span class="whitespace-nowrap text-[19px] font-extrabold tracking-[-0.7px] text-[var(--text-primary)] sm:text-[20px]">ThemeHaven</span>
    </a>

    <div class="hidden h-full items-center gap-2 xl:flex xl:justify-self-start">
      <a href="{% url 'home' %}" class="navbar-link relative flex h-full items-center px-3 text-[14px] font-semibold text-[var(--text-secondary)] transition hover:text-[var(--accent)]">Home</a>
      <details class="nav-dropdown group relative h-full">
        <summary class="flex h-full cursor-pointer list-none items-center gap-1 px-3 text-[14px] font-medium text-[var(--text-secondary)] transition hover:text-[var(--accent)] focus-visible:outline-offset-[-4px]">Themes <svg class="h-3 w-3 transition group-open:rotate-180" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
        <div class="nav-dropdown-menu absolute left-0 top-[calc(100%-8px)] z-50 min-w-48 rounded-xl border border-[var(--border-color)] bg-[var(--bg-secondary)] p-2 shadow-xl">
          <a class="block rounded-lg px-3 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)] hover:text-[var(--accent)]" href="{% url 'theme' %}">WordPress Themes</a>
          <a class="block rounded-lg px-3 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)] hover:text-[var(--accent)]" href="{% url 'catagories' %}">Browse by Platform</a>
        </div>
      </details>
      <details class="nav-dropdown group relative h-full">
        <summary class="flex h-full cursor-pointer list-none items-center gap-1 px-3 text-[14px] font-medium text-[var(--text-secondary)] transition hover:text-[var(--accent)] focus-visible:outline-offset-[-4px]">Templates <svg class="h-3 w-3 transition group-open:rotate-180" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
        <div class="nav-dropdown-menu absolute left-0 top-[calc(100%-8px)] z-50 min-w-48 rounded-xl border border-[var(--border-color)] bg-[var(--bg-secondary)] p-2 shadow-xl">
          <a class="block rounded-lg px-3 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)] hover:text-[var(--accent)]" href="{% url 'catagories' %}">All Templates</a>
          <a class="block rounded-lg px-3 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)] hover:text-[var(--accent)]" href="{% url 'theme' %}">Explore Themes</a>
        </div>
      </details>
      <a href="{% url 'about' %}" class="navbar-link relative flex h-full items-center px-3 text-[14px] font-medium text-[var(--text-secondary)] transition hover:text-[var(--accent)]">About</a>
      <a href="{% url 'support' %}" class="navbar-link relative flex h-full items-center px-3 text-[14px] font-medium text-[var(--text-secondary)] transition hover:text-[var(--accent)]">Support</a>
    </div>

    <div class="flex shrink-0 items-center gap-2 sm:gap-4 xl:justify-self-end">
      <button id="navbarSearchButton" type="button" aria-label="Open product search" title="Search" class="hidden h-10 w-9 items-center justify-center rounded-full text-[var(--text-primary)] transition hover:text-[var(--accent)] focus-visible:outline-offset-1 sm:flex">
        <svg class="h-[21px] w-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </button>
      <a href="/cart/" aria-label="Shopping cart, 0 items" title="Shopping cart" class="relative flex h-10 w-9 items-center justify-center rounded-full text-[var(--text-primary)] transition hover:text-[var(--accent)] focus-visible:outline-offset-1">
        <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 8H6"></path><circle cx="10" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle></svg>
        <span class="absolute right-0 top-0 flex h-[17px] min-w-[17px] items-center justify-center rounded-full bg-[var(--accent)] px-1 text-[10px] font-bold leading-none text-white">0</span>
      </a>
      <button id="themeToggle" type="button" aria-label="Switch to light theme" title="Switch theme" class="flex h-10 w-9 items-center justify-center rounded-full text-[var(--text-primary)] transition hover:text-[var(--accent)] focus-visible:outline-offset-1"><svg id="themeToggleIcon" class="h-[19px] w-[19px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg></button>
      <a href="{% url 'admin:login' %}" class="hidden whitespace-nowrap rounded-full bg-[image:var(--accent-gradient)] px-[19px] py-[10px] text-[12px] font-semibold text-white shadow-[0_5px_20px_rgba(120,25,230,0.28)] transition hover:-translate-y-0.5 focus-visible:outline-offset-4 sm:inline-flex">Login / Sign Up</a>
      <button id="mobileMenuToggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobileNavigation" class="flex h-10 w-10 items-center justify-center rounded-full border border-[var(--border-color)] text-[var(--text-primary)] transition hover:border-[var(--border-hover)] hover:text-[var(--accent)] focus-visible:outline-offset-2 xl:hidden">
        <svg id="mobileMenuIcon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
  </div>

  <div id="navbarSearchPanel" class="hidden border-t border-[var(--border-color)]">
    <div class="mx-auto max-w-[1456px] px-5 py-4 sm:px-8 xl:px-10"><form action="{% url 'theme' %}" method="get" role="search" class="mx-auto flex max-w-3xl items-center gap-3 rounded-full border border-[var(--border-color)] bg-[var(--bg-secondary)] px-4 py-2 focus-within:border-[var(--border-hover)]">
      <svg class="h-5 w-5 shrink-0 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input type="search" name="q" placeholder="Search themes and templates..." class="w-full bg-transparent px-2 py-2 text-sm text-[var(--text-primary)] outline-none placeholder:text-[var(--text-muted)]" autocomplete="off" />
      <button type="submit" class="rounded-full bg-[image:var(--accent-gradient)] px-5 py-2 text-sm font-semibold text-white transition hover:brightness-110">Search</button>
    </form></div>
  </div>

  <div id="mobileNavigation" class="hidden border-t border-[var(--border-color)] bg-[var(--bg-primary)] xl:hidden">
    <div class="mx-auto max-w-[1456px] space-y-1 px-5 py-4 sm:px-8">
      <a href="{% url 'home' %}" class="mobile-nav-link block rounded-lg px-4 py-3 text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)]">Home</a>
      <a href="{% url 'theme' %}" class="mobile-nav-link block rounded-lg px-4 py-3 text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)]">Themes</a>
      <a href="{% url 'catagories' %}" class="mobile-nav-link block rounded-lg px-4 py-3 text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)]">Templates</a>
      <a href="{% url 'about' %}" class="mobile-nav-link block rounded-lg px-4 py-3 text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)]">About</a>
      <a href="{% url 'support' %}" class="mobile-nav-link block rounded-lg px-4 py-3 text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)]">Support</a>
      <button id="mobileSearchButton" type="button" class="flex w-full items-center gap-3 rounded-lg px-4 py-3 text-left text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-card-hover)]">Search products</button>
      <a href="{% url 'admin:login' %}" class="mt-3 flex items-center justify-center rounded-full bg-[image:var(--accent-gradient)] px-4 py-3 text-sm font-semibold text-white">Login / Sign Up</a>
    </div>
  </div>
</nav>

<script>
(() => {
  const navbar = document.getElementById("themehub-navbar");
  if (!navbar) return;
  const menuToggle = document.getElementById("mobileMenuToggle");
  const mobileNavigation = document.getElementById("mobileNavigation");
  const menuIcon = document.getElementById("mobileMenuIcon");
  const searchPanel = document.getElementById("navbarSearchPanel");
  const searchInput = searchPanel?.querySelector("input");
  const updateScrollState = () => navbar.classList.toggle("is-scrolled", window.scrollY > 12);
  window.addEventListener("scroll", updateScrollState, { passive: true });
  updateScrollState();
  const closeMenu = () => {
    mobileNavigation?.classList.add("hidden");
    menuToggle?.setAttribute("aria-expanded", "false");
    menuToggle?.setAttribute("aria-label", "Open navigation menu");
    if (menuIcon) menuIcon.innerHTML = '<path d="M4 7h16M4 12h16M4 17h16"></path>';
  };
  const toggleSearch = () => {
    const wasHidden = searchPanel?.classList.contains("hidden");
    searchPanel?.classList.toggle("hidden");
    closeMenu();
    if (wasHidden) window.setTimeout(() => searchInput?.focus(), 50);
  };
  menuToggle?.addEventListener("click", () => {
    if (menuToggle.getAttribute("aria-expanded") === "true") return closeMenu();
    mobileNavigation?.classList.remove("hidden");
    menuToggle.setAttribute("aria-expanded", "true");
    menuToggle.setAttribute("aria-label", "Close navigation menu");
    if (menuIcon) menuIcon.innerHTML = '<path d="m6 6 12 12m0-12L6 18"></path>';
  });
  mobileNavigation?.querySelectorAll("a").forEach(link => link.addEventListener("click", closeMenu));
  document.getElementById("navbarSearchButton")?.addEventListener("click", toggleSearch);
  document.getElementById("mobileSearchButton")?.addEventListener("click", toggleSearch);
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeMenu();
      searchPanel?.classList.add("hidden");
      navbar.querySelectorAll(".nav-dropdown[open]").forEach(dropdown => dropdown.removeAttribute("open"));
    }
  });
  document.addEventListener("click", event => {
    if (!event.target.closest("#navbarSearchPanel, #navbarSearchButton, #mobileSearchButton")) {
      searchPanel?.classList.add("hidden");
    }
    if (!navbar.contains(event.target)) {
      closeMenu();
      navbar.querySelectorAll(".nav-dropdown[open]").forEach(dropdown => dropdown.removeAttribute("open"));
    }
  });
  window.addEventListener("resize", () => { if (window.innerWidth >= 1280) closeMenu(); });
  const currentPath = window.location.pathname.replace(/\/$/, "") || "/";
  navbar.querySelectorAll(".navbar-link, .mobile-nav-link").forEach(link => {
    const linkPath = new URL(link.href, window.location.origin).pathname.replace(/\/$/, "") || "/";
    if (linkPath === currentPath) {
      link.setAttribute("aria-current", "page");
      if (link.classList.contains("navbar-link")) link.classList.add("is-active", "text-[var(--text-primary)]");
    }
  });
})();
</script>
