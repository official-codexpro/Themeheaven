<div id="product-preview-modal" class="preview-modal fixed inset-0 z-[90] hidden items-center justify-center overflow-y-auto bg-black/65 p-4 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-labelledby="product-preview-title" hidden>
  <div class="relative w-full max-w-3xl overflow-hidden rounded-[24px] border border-[var(--border-color)] bg-[var(--bg-secondary)] shadow-[0_24px_80px_rgba(0,0,0,0.45)]">
    <button type="button" data-preview-close aria-label="Close quick preview" class="absolute right-4 top-4 z-10 flex h-10 w-10 items-center justify-center rounded-full border border-[var(--border-color)] bg-[var(--bg-card)] text-xl text-[var(--text-primary)] backdrop-blur transition hover:border-[var(--border-hover)] hover:text-[var(--accent)]">×</button>
    <div class="grid max-h-[88vh] overflow-y-auto md:grid-cols-[minmax(0,1fr)_minmax(0,0.9fr)]">
      <div class="bg-[var(--bg-tertiary)]">
        <img data-preview-image src="" alt="" class="h-[210px] w-full object-cover object-top sm:h-[260px] md:h-full md:min-h-[420px]" />
      </div>
      <div class="p-5 sm:p-7">
        <p data-preview-kind class="text-[11px] font-bold uppercase tracking-[0.16em] text-[var(--accent)]"></p>
        <h2 id="product-preview-title" data-preview-title class="mt-2 text-2xl font-extrabold tracking-[-0.05em] sm:text-3xl"></h2>
        <p data-preview-description class="mt-3 text-[13px] leading-6 text-[var(--text-secondary)]"></p>
        <div class="mt-5 flex flex-wrap items-center gap-3 border-t border-[var(--border-color)] pt-4">
          <span data-preview-price class="text-xl font-extrabold"></span>
          <span data-preview-original class="text-sm text-[var(--text-muted)] line-through" hidden></span>
        </div>
        <div data-preview-gallery-wrap class="mt-5" hidden>
          <p class="text-[11px] font-bold uppercase tracking-[0.14em] text-[var(--text-muted)]">Screenshots</p>
          <div data-preview-gallery class="mt-2 flex gap-2 overflow-x-auto pb-1"></div>
        </div>
        <div class="mt-6 flex flex-col gap-2 sm:flex-row">
          <a data-preview-detail href="#" class="inline-flex items-center justify-center gap-2 rounded-full bg-[image:var(--accent-gradient)] px-5 py-2.5 text-[13px] font-bold text-white transition hover:brightness-110">View Details <span aria-hidden="true">→</span></a>
          <a data-preview-demo href="#" data-track-event="live_preview" data-track-name="live_preview_modal" data-track-type="external_link_click" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 rounded-full border border-[var(--border-color)] bg-[var(--bg-card)] px-5 py-2.5 text-[13px] font-bold transition hover:border-[var(--border-hover)]" hidden>Live Preview <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </div>
  </div>
</div>
