{% load static %}
<nav id="themehub-navbar" class="sticky top-0 z-50 w-full bg-transparent">
  <div class="mx-auto grid h-[64px] max-w-[1456px] grid-cols-[1fr_auto] items-center gap-3 px-4 sm:h-[72px] sm:gap-4 sm:px-8 xl:h-[76px] xl:grid-cols-[295px_auto_1fr] xl:pl-10 xl:pr-8 2xl:pr-0">
    <a href="{% url 'home' %}" aria-label="ThemeHaven home" class="flex min-w-0 items-center gap-1.5 justify-self-start sm:gap-2 xl:gap-2.5">
      <img src="{% static 'img/logo.png' %}" alt="" class="h-[24px] w-[43px] shrink-0 object-contain sm:h-[27px] sm:w-[49px] xl:h-[30px] xl:w-[54px]" />
      <span class="whitespace-nowrap text-[16px] font-extrabold tracking-[-0.5px] text-[var(--text-primary)] sm:text-[18px] xl:text-[20px] xl:tracking-[-0.7px]">ThemeHaven</span>
    </a>

    <div class="hidden h-full items-center gap-2 xl:flex xl:justify-self-start"></div>

    <div class="flex shrink-0 items-center gap-1.5 sm:gap-3 xl:gap-4 xl:justify-self-end">
      <button id="navbarSearchButton" type="button" aria-label="Open product search" title="Search" class="hidden h-10 w-9 items-center justify-center rounded-full text-[var(--text-primary)] transition hover:text-[var(--accent)] focus-visible:outline-offset-1 sm:flex">
        <svg class="h-[21px] w-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </button>
      <a href="/cart/" aria-label="Shopping cart, 0 items" title="Shopping cart" class="relative flex h-9 w-8 items-center justify-center rounded-full text-[var(--text-primary)] transition hover:text-[var(--accent)] focus-visible:outline-offset-1 sm:h-10 sm:w-9 xl:h-10 xl:w-9">
        <svg class="h-[20px] w-[20px] sm:h-[22px] sm:w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 8H6"></path><circle cx="10" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle></svg>
        <span class="absolute right-0 top-0 flex h-[15px] min-w-[15px] items-center justify-center rounded-full bg-[var(--accent)] px-0.5 text-[9px] font-bold leading-none text-white sm:h-[17px] sm:min-w-[17px] sm:px-1 sm:text-[10px]">0</span>
      </a>

      <a href="{% url 'admin:login' %}" class="hidden whitespace-nowrap rounded-full bg-[image:var(--accent-gradient)] px-[19px] py-[10px] text-[12px] font-semibold text-white shadow-[0_5px_20px_rgba(120,25,230,0.28)] transition hover:-translate-y-0.5 focus-visible:outline-offset-4 sm:inline-flex">Login / Sign Up</a>
      <button id="mobileMenuToggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobileNavigation" class="flex h-9 w-9 items-center justify-center rounded-full border border-[var(--border-color)] text-[var(--text-primary)] transition duration-300 hover:border-[var(--border-hover)] hover:text-[var(--accent)] active:scale-95 focus-visible:outline-offset-2 sm:h-10 sm:w-10 xl:hidden">
        <svg id="mobileMenuIcon" class="h-[18px] w-[18px] sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>

      {% if appearance.desktop.enabled %}
      <div class="hidden xl:block">
        <div class="theme-pull-slot theme-pull-slot--{{ appearance.desktop.position }}{% if appearance.desktop.background_enabled %} appearance-desktop-custom-bg{% endif %}{% if not appearance.desktop.tooltip_enabled %} appearance-desktop-no-tooltip{% endif %}{% if not appearance.desktop.hover_effects %} appearance-desktop-no-hover{% endif %}{% if not appearance.desktop.transition %} appearance-desktop-no-transition{% endif %}" aria-hidden="false">
          <button id="themePullToggle" type="button" class="theme-pull-toggle" aria-label="Switch to light theme" aria-pressed="false" title="Pull to switch theme">
            <span class="sr-only">Toggle color theme</span>
            <span class="theme-pull-tooltip" aria-hidden="true"><span class="theme-pull-tooltip-text">{{ appearance.desktop.tooltip_text }}</span></span>
            <span class="theme-pull-housing" aria-hidden="true">
              <span class="theme-pull-housing-cap"></span>
              <span class="theme-pull-housing-bulb"><svg class="theme-pull-housing-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">{% if appearance.desktop.svg_markup %}{{ appearance.desktop.svg_markup|safe }}{% else %}<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>{% endif %}</svg></span>
            </span>
            <svg class="theme-pull-svg" viewBox="0 0 48 148" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="themeBrassBody" x1="0.15" y1="0" x2="0.95" y2="1">
                  <stop offset="0%" stop-color="#fff4d8" /><stop offset="18%" stop-color="#e2c07a" /><stop offset="42%" stop-color="#b8893d" /><stop offset="58%" stop-color="#f0d58f" /><stop offset="78%" stop-color="#9b702f" /><stop offset="100%" stop-color="#6f4d1f" />
                </linearGradient>
                <linearGradient id="themeBrassCap" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#f8e8b8" /><stop offset="45%" stop-color="#c99b4b" /><stop offset="100%" stop-color="#7a5624" />
                </linearGradient>
                <linearGradient id="themeCordDark" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#2a2433" /><stop offset="45%" stop-color="#5a5167" /><stop offset="100%" stop-color="#211b2b" />
                </linearGradient>
                <linearGradient id="themeCordLight" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#6a6178" /><stop offset="45%" stop-color="#9d93ad" /><stop offset="100%" stop-color="#5c536a" />
                </linearGradient>
                <filter id="themeKnobShadow" x="-40%" y="-20%" width="180%" height="180%">
                  <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#120a1f" flood-opacity="0.28" />
                </filter>
                <radialGradient id="themeKnobGlowDark" cx="50%" cy="45%" r="50%">
                  <stop offset="0%" stop-color="rgba(196,181,253,0.55)" /><stop offset="55%" stop-color="rgba(167,139,250,0.22)" /><stop offset="100%" stop-color="rgba(109,69,184,0)" />
                </radialGradient>
                <radialGradient id="themeKnobGlowLight" cx="50%" cy="45%" r="50%">
                  <stop offset="0%" stop-color="rgba(255,248,230,0.8)" /><stop offset="55%" stop-color="rgba(255,236,196,0.3)" /><stop offset="100%" stop-color="rgba(255,236,196,0)" />
                </radialGradient>
              </defs>
              <g class="theme-pull-cord">
                <path id="themeCordShadow" d="M24 2 C23.2 18, 24.8 36, 24 54 C23.4 66, 24.6 78, 24 88" class="theme-pull-cord-shadow" />
                <path id="themeCordLine" d="M24 2 C23.2 18, 24.8 36, 24 54 C23.4 66, 24.6 78, 24 88" class="theme-pull-cord-line" />
                <path id="themeCordHighlight" d="M23.25 2 C22.45 18, 24.05 36, 23.25 54 C22.65 66, 23.85 78, 23.25 88" class="theme-pull-cord-highlight" />
                <path id="themeCordBraid" d="M24 10 C22.8 12, 25.2 14, 24 16 C22.8 18, 25.2 20, 24 22 C22.8 24, 25.2 26, 24 28 C22.8 30, 25.2 32, 24 34 C22.8 36, 25.2 38, 24 40 C22.8 42, 25.2 44, 24 46 C22.8 48, 25.2 50, 24 52 C22.8 54, 25.2 56, 24 58 C22.8 60, 25.2 62, 24 64 C22.8 66, 25.2 68, 24 70 C22.8 72, 25.2 74, 24 76 C22.8 78, 25.2 80, 24 82 C22.8 84, 25.2 86, 24 88" class="theme-pull-cord-braid" />
              </g>
              <g id="themePullKnob" class="theme-pull-knob" filter="url(#themeKnobShadow)">
                <circle cx="24" cy="92" r="13" class="theme-pull-knob-glow" />
                <ellipse cx="24" cy="90.5" rx="3.1" ry="1.7" class="theme-pull-knob-ring" />
                <rect x="22.4" y="91.5" width="3.2" height="2.5" rx="1" class="theme-pull-knob-cap" />
                <path d="M24 94.2 C20.1 94.2 17.2 96.7 17.2 100.3 C17.2 103.4 19 105.9 21.6 107.1 L22.8 114.2 C23.1 116 23.5 116.8 24 116.8 C24.5 116.8 24.9 116 25.2 114.2 L26.4 107.1 C29 105.9 30.8 103.4 30.8 100.3 C30.8 96.7 27.9 94.2 24 94.2 Z" class="theme-pull-knob-body" />
                <path d="M20.4 98.2 C21.4 96.6 22.7 95.8 24 95.8 C25.3 95.8 26.6 96.6 27.6 98.2" class="theme-pull-knob-specular" />
                <path d="M20.1 102.2 C21.2 103.6 22.5 104.3 24 104.3 C25.5 104.3 26.8 103.6 27.9 102.2" class="theme-pull-knob-detail" />
                <path d="M22.7 109.2 L25.3 109.2" class="theme-pull-knob-detail" />
                <path d="M23.2 112.4 L24.8 112.4" class="theme-pull-knob-detail" />
                <ellipse cx="21.2" cy="100.4" rx="1.1" ry="3.8" class="theme-pull-knob-shadow-edge" />
              </g>
            </svg>
          </button>
        </div>
      </div>
      {% endif %}
    </div>
  </div>

  <div id="navbarSearchPanel" class="hidden border-t border-[var(--border-color)]">
    <div class="mx-auto max-w-[1456px] px-5 py-4 sm:px-8 xl:px-10"><form action="{% url 'home' %}" method="get" role="search" class="mx-auto flex max-w-3xl items-center gap-3 rounded-full border border-[var(--border-color)] bg-[var(--bg-secondary)] px-4 py-2 focus-within:border-[var(--border-hover)]">
      <svg class="h-5 w-5 shrink-0 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input type="search" name="q" placeholder="Search themes and templates..." class="w-full bg-transparent px-2 py-2 text-sm text-[var(--text-primary)] outline-none placeholder:text-[var(--text-muted)]" autocomplete="off" />
      <button type="submit" class="rounded-full bg-[image:var(--accent-gradient)] px-5 py-2 text-sm font-semibold text-white transition hover:brightness-110">Search</button>
    </form></div>
  </div>

  <div id="mobileNavigation" class="mobile-nav-panel relative z-[65] border-t border-[var(--border-color)] bg-[var(--bg-primary)] shadow-[0_20px_50px_rgba(10,6,22,0.22)] xl:hidden" aria-hidden="true" inert>
    <div class="mx-auto max-w-[1456px] space-y-1 px-4 py-3.5 sm:px-8 sm:py-4">
      <form action="{% url 'home' %}" method="get" role="search" class="mobile-nav-item [--stagger:1] flex items-center gap-2.5 rounded-full border border-[var(--border-color)] bg-[var(--bg-secondary)] px-3.5 py-2 focus-within:border-[var(--border-hover)] sm:gap-3 sm:px-4">
        <svg class="h-[18px] w-[18px] shrink-0 text-[var(--text-muted)] sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <label class="sr-only" for="mobileSearch">Search themes and templates</label>
        <input id="mobileSearch" type="search" name="q" placeholder="Search themes and templates..." class="w-full bg-transparent px-1 py-2 text-[13px] text-[var(--text-primary)] outline-none placeholder:text-[var(--text-muted)] sm:px-2 sm:text-sm" autocomplete="off" />
        <button type="submit" class="shrink-0 rounded-full bg-[image:var(--accent-gradient)] px-4 py-2 text-[13px] font-semibold text-white transition hover:brightness-110 active:scale-95 sm:px-5 sm:text-sm">Search</button>
      </form>

      <div class="my-2.5 h-px bg-[var(--border-color)] sm:my-3"></div>

      <p class="mobile-nav-item [--stagger:2] px-4 pb-1 text-[10px] font-bold uppercase tracking-[0.18em] text-[var(--text-muted)]">Quick actions</p>
      <a href="/cart/" class="mobile-nav-item [--stagger:3] flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-[var(--text-secondary)] transition hover:bg-[var(--bg-card-hover)] hover:text-[var(--accent)]">
        <svg class="h-5 w-5 shrink-0 text-[var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 8H6"></path><circle cx="10" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle></svg>
        <span class="flex-1">Shopping Cart</span>
      </a>
      {% if appearance.mobile.enabled %}
      <button type="button" data-theme-toggle aria-label="Switch to light theme" aria-pressed="false" title="{{ appearance.mobile.tooltip_text }}" class="mobile-nav-item [--stagger:4] appearance-mobile-switcher appearance-mobile-{{ appearance.mobile.position }}{% if appearance.mobile.background_enabled %} appearance-mobile-custom-bg{% endif %}{% if appearance.mobile.tooltip_enabled %} appearance-mobile-tooltip-enabled{% endif %}{% if not appearance.mobile.hover_effects %} appearance-mobile-no-hover{% endif %}{% if not appearance.mobile.transition %} appearance-mobile-no-transition{% endif %} flex w-full items-center gap-3 rounded-lg px-4 py-3 text-left text-sm font-medium text-[var(--text-secondary)] transition duration-300 hover:bg-[var(--bg-card-hover)] hover:text-[var(--accent)] active:scale-[0.99] focus-visible:outline-offset-[-3px]">
        <span class="appearance-mobile-tooltip" aria-hidden="true">{{ appearance.mobile.tooltip_text }}</span>
        <span class="flex h-5 w-5 shrink-0 items-center justify-center appearance-mobile-icon">
          {% if appearance.mobile.svg_markup %}
            {{ appearance.mobile.svg_markup|safe }}
          {% else %}
            <svg data-theme-icon="moon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 15.4A8.5 8.5 0 0 1 8.6 3.2 8.5 8.5 0 1 0 20.8 15.4Z"></path></svg>
            <svg data-theme-icon="sun" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
          {% endif %}
        </span>
        <span class="flex-1" data-theme-label>Light mode</span>
      </button>
      {% endif %}
      <a href="{% url 'admin:login' %}" class="mobile-nav-item [--stagger:5] mt-3 flex items-center justify-center rounded-full bg-[image:var(--accent-gradient)] px-4 py-3 text-sm font-semibold text-white shadow-[0_6px_20px_rgba(120,25,230,0.24)] transition hover:brightness-110 active:scale-[0.99] sm:hidden">
        Login / Sign Up
      </a>
    </div>
  </div>
</nav>

<script>
(() => {
  const navbar = document.getElementById("themehub-navbar");
  if (!navbar) return;

  const menuToggle = document.getElementById("mobileMenuToggle");
  const panel = document.getElementById("mobileNavigation");
  const menuIcon = document.getElementById("mobileMenuIcon");
  const searchPanel = document.getElementById("navbarSearchPanel");
  const searchInput = searchPanel?.querySelector("input");

  const setMenu = (open) => {
    panel?.classList.toggle("is-open", open);
    panel?.setAttribute("aria-hidden", String(!open));
    if (panel) {
      if (open) panel.removeAttribute("inert");
      else panel.setAttribute("inert", "");
    }
    menuToggle?.setAttribute("aria-expanded", String(open));
    menuToggle?.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
    document.body.classList.toggle("nav-menu-open", open);
    if (menuIcon) {
      menuIcon.innerHTML = open
        ? '<path d="m6 6 12 12m0-12L6 18"></path>'
        : '<path d="M4 7h16M4 12h16M4 17h16"></path>';
    }
  };

  const closeSearch = () => searchPanel?.classList.add("hidden");
  const toggleSearch = () => {
    const wasHidden = searchPanel?.classList.contains("hidden");
    setMenu(false);
    searchPanel?.classList.toggle("hidden");
    if (wasHidden) window.setTimeout(() => searchInput?.focus(), 50);
  };

  menuToggle?.addEventListener("click", () => {
    setMenu(menuToggle.getAttribute("aria-expanded") !== "true");
  });
  document.getElementById("navbarSearchButton")?.addEventListener("click", toggleSearch);

  panel?.querySelectorAll("a, button").forEach((item) => {
    item.addEventListener("click", () => {
      if (!item.hasAttribute("data-theme-toggle")) setMenu(false);
    });
  });
  panel?.querySelector("form")?.addEventListener("submit", () => setMenu(false));

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      if (menuToggle?.getAttribute("aria-expanded") === "true") {
        setMenu(false);
        menuToggle?.focus();
      }
      closeSearch();
    }
  });

  document.addEventListener("click", (event) => {
    if (!navbar.contains(event.target)) setMenu(false);
    if (!event.target.closest("#navbarSearchPanel, #navbarSearchButton")) closeSearch();
  });

  window.addEventListener("resize", () => {
    if (window.innerWidth >= 1280) setMenu(false);
  });

  const updateScrollState = () => navbar.classList.toggle("is-scrolled", window.scrollY > 12);
  window.addEventListener("scroll", updateScrollState, { passive: true });
  updateScrollState();
})();
</script>
