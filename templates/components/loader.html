{% load static %}
<div id="th-loader" class="th-loader" role="status" aria-live="polite" aria-label="Loading ThemeHaven">
  <style>
    .th-loader {
      --l-bg: #06040f;
      --l-bg2: #120824;
      --l-bg3: #090516;
      --l-text: #f8f6ff;
      --l-muted: #b7afd1;
      --l-accent: #8b35f5;
      --l-accent2: #c4b5fd;
      --l-glow: rgba(139, 53, 245, 0.24);
      --l-glow2: rgba(167, 139, 250, 0.12);
      --l-logo-shadow: drop-shadow(0 12px 30px rgba(139, 53, 245, 0.34));
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
      color: var(--l-text);
      font-family: var(--font-primary, "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif);
      isolation: isolate;
    }

    [data-theme="light"] .th-loader {
      --l-bg: #f5f1fc;
      --l-bg2: #e7ddf8;
      --l-bg3: #fbf9ff;
      --l-text: #121026;
      --l-muted: #564e70;
      --l-accent: #7a2fe0;
      --l-accent2: #6d28d9;
      --l-glow: rgba(122, 47, 224, 0.14);
      --l-glow2: rgba(167, 139, 250, 0.12);
      --l-logo-shadow: drop-shadow(0 10px 24px rgba(122, 47, 224, 0.16));
    }

    .th-loader.is-done {
      visibility: hidden;
      pointer-events: none;
    }

    /* Unified full-bleed curtain backdrop split cleanly into left & right panels */
    .th-drape-left,
    .th-drape-right {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 50vw;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      will-change: transform;
    }

    .th-drape-left {
      left: 0;
    }

    .th-drape-right {
      right: 0;
    }

    .th-drape-sheet {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100vw;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.0) 0px,
          rgba(255, 255, 255, 0.025) 36px,
          rgba(0, 0, 0, 0.24) 72px,
          rgba(255, 255, 255, 0.02) 108px,
          rgba(0, 0, 0, 0.22) 144px
        ),
        radial-gradient(ellipse 68% 52% at 50% 45%, var(--l-glow), transparent 72%),
        radial-gradient(ellipse 46% 38% at 76% 24%, var(--l-glow2), transparent 70%),
        radial-gradient(ellipse 46% 38% at 24% 78%, var(--l-glow2), transparent 72%),
        linear-gradient(175deg, var(--l-bg2) 0%, var(--l-bg) 56%, var(--l-bg3) 100%);
    }

    [data-theme="light"] .th-drape-sheet {
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.0) 0px,
          rgba(255, 255, 255, 0.34) 38px,
          rgba(67, 52, 112, 0.075) 76px,
          rgba(255, 255, 255, 0.28) 114px,
          rgba(67, 52, 112, 0.07) 152px
        ),
        radial-gradient(ellipse 68% 52% at 50% 45%, var(--l-glow), transparent 72%),
        radial-gradient(ellipse 46% 38% at 76% 24%, var(--l-glow2), transparent 70%),
        linear-gradient(175deg, var(--l-bg2) 0%, var(--l-bg) 56%, var(--l-bg3) 100%);
    }

    .th-drape-left .th-drape-sheet {
      left: 0;
    }

    .th-drape-right .th-drape-sheet {
      right: 0;
    }

    .th-loader-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      will-change: opacity;
    }

    .th-loader-hero {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      pointer-events: none;
      transform: translateY(-24px);
      will-change: transform, opacity, filter;
    }

    .th-loader-brand-lockup {
      position: relative;
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 14px;
      padding: 12px 22px;
      border-radius: 18px;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      filter: blur(8px);
      will-change: transform, opacity, filter;
    }

    .th-loader-brand-aura {
      position: absolute;
      inset: -26px -34px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(139, 53, 245, 0.34), rgba(167, 139, 250, 0.07) 60%, transparent 76%);
      filter: blur(18px);
      z-index: 0;
      pointer-events: none;
    }

    [data-theme="light"] .th-loader-brand-aura {
      background: radial-gradient(circle, rgba(122, 47, 224, 0.16), transparent 74%);
    }

    .th-loader-logo {
      position: relative;
      z-index: 2;
      display: block;
      height: 46px;
      width: 82px;
      flex-shrink: 0;
      object-fit: contain;
      filter: var(--l-logo-shadow);
    }

    .th-loader-title {
      position: relative;
      z-index: 2;
      white-space: nowrap;
      font-size: clamp(32px, 4.2vw, 44px);
      font-weight: 800;
      letter-spacing: -0.7px;
      line-height: 1.05;
      color: var(--l-text);
      text-shadow: 0 10px 30px rgba(139, 53, 245, 0.24);
    }

    [data-theme="light"] .th-loader-title {
      text-shadow: 0 6px 22px rgba(122, 47, 224, 0.12);
    }

    .th-loader-title span {
      display: inline-block;
      opacity: 0;
      transform: translateY(12px);
      filter: blur(5px);
      will-change: transform, opacity, filter;
    }

    .th-loader-sub {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--l-muted);
      opacity: 0;
      transform: translateY(8px);
      will-change: transform, opacity;
    }

    .th-loader-progress {
      width: min(240px, 64vw);
      display: flex;
      flex-direction: column;
      gap: 7px;
      opacity: 0;
      transform: translateY(8px);
      will-change: transform, opacity;
    }

    .th-loader-track {
      height: 2px;
      width: 100%;
      border-radius: 999px;
      background: rgba(196, 181, 253, 0.15);
      overflow: hidden;
    }

    [data-theme="light"] .th-loader-track {
      background: rgba(122, 47, 224, 0.15);
    }

    .th-loader-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #782bfa, #a78bfa, #e9d5ff);
      box-shadow: 0 0 14px rgba(167, 139, 250, 0.45);
      will-change: width;
    }

    .th-loader-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--l-muted);
    }

    .th-loader-pct {
      font-variant-numeric: tabular-nums;
      color: var(--l-accent2);
      font-weight: 600;
    }

    .th-loader-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html.th-loader-active,
    html.th-loader-active body {
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .th-loader-hero {
        transform: translateY(-38px);
        gap: 14px;
      }
      .th-loader-brand-lockup {
        gap: 10px;
        padding: 10px 14px;
      }
      .th-loader-logo {
        height: 36px;
        width: 64px;
      }
      .th-loader-title {
        font-size: 26px;
        letter-spacing: -0.7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .th-loader,
      .th-loader *,
      .th-loader *::before,
      .th-loader *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <div class="th-drape-left" id="thDrapeLeft" aria-hidden="true">
    <div class="th-drape-sheet"></div>
  </div>
  <div class="th-drape-right" id="thDrapeRight" aria-hidden="true">
    <div class="th-drape-sheet"></div>
  </div>

  <canvas class="th-loader-canvas" id="thLoaderCanvas" aria-hidden="true"></canvas>

  <div class="th-loader-hero" id="thLoaderHero">
    <div class="th-loader-brand-lockup" id="thLoaderBrand">
      <div class="th-loader-brand-aura" id="thLoaderAura"></div>
      <img src="{% static 'img/logo.png' %}" alt="" class="th-loader-logo" width="82" height="46" />
      <span class="th-loader-title" aria-label="ThemeHaven">
        <span>T</span><span>h</span><span>e</span><span>m</span><span>e</span><span>H</span><span>a</span><span>v</span><span>e</span><span>n</span>
      </span>
    </div>
    <div class="th-loader-sub" id="thLoaderSub">Signature Web &amp; UI Craft</div>
    <div class="th-loader-progress" id="thLoaderProgress">
      <div class="th-loader-track">
        <div class="th-loader-fill" id="thLoaderFill"></div>
      </div>
      <div class="th-loader-meta">
        <span id="thLoaderState">Loading</span>
        <span class="th-loader-pct" id="thLoaderPct">0%</span>
      </div>
    </div>
    <span class="th-loader-sr" id="thLoaderSr">Loading ThemeHaven</span>
  </div>
</div>

<script>
(() => {
  'use strict';

  const loader = document.getElementById('th-loader');
  if (!loader || loader.dataset.thInit === '1') return;
  loader.dataset.thInit = '1';

  const root = document.documentElement;
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
  const navType = navEntry ? navEntry.type : '';
  const alreadySeen = sessionStorage.getItem('th-loader-seen') === '1';

  if (alreadySeen && navType !== 'reload') {
    loader.remove();
    return;
  }

  const drapeLeft = document.getElementById('thDrapeLeft');
  const drapeRight = document.getElementById('thDrapeRight');
  const canvas = document.getElementById('thLoaderCanvas');
  const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  const heroEl = document.getElementById('thLoaderHero');
  const brandEl = document.getElementById('thLoaderBrand');
  const subEl = document.getElementById('thLoaderSub');
  const progressEl = document.getElementById('thLoaderProgress');
  const fillEl = document.getElementById('thLoaderFill');
  const pctEl = document.getElementById('thLoaderPct');
  const stateEl = document.getElementById('thLoaderState');
  const srEl = document.getElementById('thLoaderSr');
  const letters = Array.from(loader.querySelectorAll('.th-loader-title span'));

  root.classList.add('th-loader-active');

  let width = 0;
  let height = 0;
  let dpr = 1;
  let rafId = 0;
  let startTime = 0;
  let disposed = false;
  let pageLoaded = document.readyState === 'complete';

  let visualProgress = 0;
  let targetProgress = 0;
  let curtainStarted = false;
  let curtainStartAt = 0;
  let ropePullDown = 0;
  let ropePullLeft = 0;

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeInOutQuint(t) {
    return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
  }

  function isLight() {
    return root.getAttribute('data-theme') === 'light';
  }

  function resize() {
    width = window.innerWidth || document.documentElement.clientWidth || 1280;
    height = window.innerHeight || document.documentElement.clientHeight || 720;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    if (canvas && ctx) {
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function getLayout() {
    const mobile = width < 640;
    const floorY = height * (mobile ? 0.85 : 0.83);
    const scale = clamp(height / 760, mobile ? 0.58 : 0.72, 1.15);
    const ropeTopX = width * (mobile ? 0.76 : 0.74);
    const ropeTopY = 0;
    const ropeRestY = clamp(height * (mobile ? 0.44 : 0.48), 220, 430);
    const standX = ropeTopX - 46 * scale;

    return {
      mobile,
      floorY,
      scale,
      ropeTopX,
      ropeTopY,
      ropeRestY,
      standX
    };
  }

  function solveTwoBone(origin, target, lenA, lenB, elbowDir) {
    const dx = target.x - origin.x;
    const dy = target.y - origin.y;
    const maxLen = (lenA + lenB) * 0.985;
    const minLen = Math.abs(lenA - lenB) + 2;
    const rawDist = Math.hypot(dx, dy);
    const dist = clamp(rawDist, minLen, maxLen);

    const ux = rawDist > 0.0001 ? dx / rawDist : 0;
    const uy = rawDist > 0.0001 ? dy / rawDist : -1;

    const endX = origin.x + ux * dist;
    const endY = origin.y + uy * dist;

    const cosTheta = clamp((lenA * lenA + dist * dist - lenB * lenB) / (2 * lenA * dist), -1, 1);
    const theta = Math.acos(cosTheta);
    const baseAngle = Math.atan2(endY - origin.y, endX - origin.x);
    const elbowAngle = baseAngle + elbowDir * theta;

    return {
      joint: {
        x: origin.x + Math.cos(elbowAngle) * lenA,
        y: origin.y + Math.sin(elbowAngle) * lenA
      },
      end: {
        x: endX,
        y: endY
      }
    };
  }

  function drawFloor(layout) {
    const light = isLight();
    const { floorY } = layout;

    const grad = ctx.createLinearGradient(0, floorY - 2, 0, height);
    if (light) {
      grad.addColorStop(0, 'rgba(24, 18, 48, 0.08)');
      grad.addColorStop(1, 'rgba(24, 18, 48, 0)');
    } else {
      grad.addColorStop(0, 'rgba(196, 181, 253, 0.11)');
      grad.addColorStop(1, 'rgba(6, 4, 15, 0)');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, floorY, width, height - floorY);

    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(width, floorY);
    ctx.strokeStyle = light ? 'rgba(24, 18, 48, 0.12)' : 'rgba(196, 181, 253, 0.14)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawRope(layout, now) {
    const light = isLight();
    const { ropeTopX, ropeTopY, ropeRestY, scale } = layout;

    const sway = curtainStarted ? 0 : Math.sin(now * 0.0014) * (2.2 * scale);
    const tipX = ropeTopX + ropePullLeft + sway;
    const tipY = ropeRestY + ropePullDown;

    const ctrlX = lerp(ropeTopX, tipX, 0.5) - (ropePullDown > 0 ? 3.5 * scale : 0);
    const ctrlY = lerp(ropeTopY, tipY, 0.52);

    ctx.save();
    ctx.lineCap = 'round';

    // Ceiling mount
    ctx.fillStyle = light ? '#2c2345' : '#261e40';
    ctx.beginPath();
    ctx.arc(ropeTopX, ropeTopY + 5 * scale, 5.5 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Soft rope shadow
    ctx.strokeStyle = light ? 'rgba(20, 15, 38, 0.15)' : 'rgba(0, 0, 0, 0.45)';
    ctx.lineWidth = Math.max(3.6, 4.6 * scale);
    ctx.beginPath();
    ctx.moveTo(ropeTopX + 2, ropeTopY + 5 * scale);
    ctx.quadraticCurveTo(ctrlX + 2, ctrlY, tipX + 2, tipY);
    ctx.stroke();

    // Rope strands
    const rGrad = ctx.createLinearGradient(ropeTopX - 4, ropeTopY, tipX + 4, tipY);
    if (light) {
      rGrad.addColorStop(0, '#5a4978');
      rGrad.addColorStop(0.5, '#8c7ab3');
      rGrad.addColorStop(1, '#463763');
    } else {
      rGrad.addColorStop(0, '#a694c7');
      rGrad.addColorStop(0.5, '#e6dfff');
      rGrad.addColorStop(1, '#7a66a3');
    }

    ctx.strokeStyle = rGrad;
    ctx.lineWidth = Math.max(3.3, 4.2 * scale);
    ctx.beginPath();
    ctx.moveTo(ropeTopX, ropeTopY + 5 * scale);
    ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
    ctx.stroke();

    // Twist lines
    const ticks = 14;
    ctx.strokeStyle = light ? 'rgba(32, 22, 54, 0.34)' : 'rgba(18, 12, 36, 0.44)';
    ctx.lineWidth = Math.max(1, 1.2 * scale);
    for (let i = 1; i < ticks; i++) {
      const t = i / ticks;
      const mt = 1 - t;
      const px = mt * mt * ropeTopX + 2 * mt * t * ctrlX + t * t * tipX;
      const py = mt * mt * (ropeTopY + 5 * scale) + 2 * mt * t * ctrlY + t * t * tipY;
      ctx.beginPath();
      ctx.moveTo(px - 2.2 * scale, py - 1.4 * scale);
      ctx.lineTo(px + 2.2 * scale, py + 1.4 * scale);
      ctx.stroke();
    }

    // Pull grip handle
    const gw = 8.5 * scale;
    const gh = 22 * scale;
    const gGrad = ctx.createLinearGradient(tipX - gw * 0.5, tipY, tipX + gw * 0.5, tipY + gh);
    if (light) {
      gGrad.addColorStop(0, '#493a66');
      gGrad.addColorStop(0.5, '#7c6aa1');
      gGrad.addColorStop(1, '#2d2245');
    } else {
      gGrad.addColorStop(0, '#c4b5fd');
      gGrad.addColorStop(0.5, '#8b5cf6');
      gGrad.addColorStop(1, '#4c1d95');
    }

    ctx.fillStyle = gGrad;
    ctx.beginPath();
    ctx.roundRect(tipX - gw * 0.5, tipY, gw, gh, 4 * scale);
    ctx.fill();

    ctx.strokeStyle = light ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();

    return {
      gripPos: { x: tipX, y: tipY + gh * 0.45 }
    };
  }

  // Lifelike human gait, torso counter-rotation, weight shift & rope pull
  function drawHuman(layout, gripPos, motion) {
    const light = isLight();
    const { floorY, scale } = layout;
    const { hipX, walkBlend, walkPhase, reachBlend, pullBlend } = motion;

    const thighLen = 46 * scale;
    const shinLen = 45 * scale;
    const torsoLen = 60 * scale;
    const neckLen = 11 * scale;
    const headR = 16 * scale;
    const upperArmLen = 38 * scale;
    const foreArmLen = 35 * scale;

    // Realistic double-frequency vertical oscillation (2 steps per full walk cycle)
    const stepWave = Math.sin(walkPhase);
    const bounceWave = Math.abs(Math.cos(walkPhase));
    const walkBounce = walkBlend * (1 - bounceWave) * (4.2 * scale);
    const pullWeightShift = pullBlend * (7.5 * scale);

    const ankleY = floorY - 6 * scale;
    const hipY = ankleY - (thighLen + shinLen) + walkBounce + pullWeightShift;

    // Forward posture shifts smoothly from walk to braced pull
    const leanAngle = walkBlend * 0.065 + pullBlend * 0.085;
    const shoulderX = hipX + Math.sin(leanAngle) * torsoLen;
    const shoulderY = hipY - Math.cos(leanAngle) * torsoLen;

    // Ground shadow
    const shRadiusX = (46 + Math.abs(stepWave) * 10) * scale;
    const shGrad = ctx.createRadialGradient(hipX, floorY + 2, 2, hipX, floorY + 2, shRadiusX);
    shGrad.addColorStop(0, light ? 'rgba(20, 15, 38, 0.24)' : 'rgba(0, 0, 0, 0.56)');
    shGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = shGrad;
    ctx.beginPath();
    ctx.ellipse(hipX, floorY + 2, shRadiusX, 6.5 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    const skinLit = light ? '#dca37d' : '#cf946d';
    const skinMid = light ? '#c2835c' : '#b27550';
    const skinDark = light ? '#9a5f3d' : '#855033';
    const hairCol = light ? '#1c172c' : '#110d1c';
    const trouserFront = light ? '#26213b' : '#1b172c';
    const trouserBack = light ? '#191529' : '#120f1e';

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Stance widens slightly when pulling rope for realistic leverage
    const stanceSpread = pullBlend * (8 * scale);

    function drawLeg(offset, isBack) {
      const p = walkPhase + offset;
      const strideAngle = walkBlend * Math.sin(p) * 0.44 + (isBack ? -stanceSpread * 0.015 : stanceSpread * 0.015);
      const liftHeight = walkBlend * Math.max(0, Math.sin(p - Math.PI * 0.25)) * (12 * scale);

      const footX = hipX + Math.sin(strideAngle) * (thighLen + shinLen) * 0.84 + (isBack ? -stanceSpread * 0.4 : stanceSpread * 0.4);
      const footY = ankleY - liftHeight;

      const ik = solveTwoBone({ x: hipX, y: hipY }, { x: footX, y: footY }, thighLen, shinLen, 1);

      // Thigh
      ctx.strokeStyle = isBack ? trouserBack : trouserFront;
      ctx.lineWidth = 14 * scale;
      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(ik.joint.x, ik.joint.y);
      ctx.stroke();

      // Calf
      ctx.strokeStyle = isBack ? trouserBack : trouserFront;
      ctx.lineWidth = 10.8 * scale;
      ctx.beginPath();
      ctx.moveTo(ik.joint.x, ik.joint.y);
      ctx.lineTo(ik.end.x, ik.end.y);
      ctx.stroke();

      // Shoe with subtle heel/toe pitch
      const shoePitch = walkBlend * Math.cos(p) * 0.16;
      ctx.save();
      ctx.translate(ik.end.x + 5 * scale, ik.end.y + 3 * scale);
      ctx.rotate(shoePitch);
      ctx.fillStyle = light ? '#141122' : '#0b0814';
      ctx.beginPath();
      ctx.ellipse(0, 0, 11 * scale, 4.2 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Back leg
    drawLeg(Math.PI, true);

    // Opposite arm swings naturally against front leg during walk, then braces smoothly
    const oppArmAngle = walkBlend * (-Math.sin(walkPhase) * 0.38) + pullBlend * 0.22;
    const oppHandTarget = {
      x: shoulderX + Math.sin(oppArmAngle) * (upperArmLen + foreArmLen) * 0.72,
      y: shoulderY + Math.cos(oppArmAngle) * (upperArmLen + foreArmLen) * 0.88
    };
    const oppArmIK = solveTwoBone(
      { x: shoulderX, y: shoulderY + 4 * scale },
      oppHandTarget,
      upperArmLen,
      foreArmLen,
      -1
    );

    ctx.strokeStyle = light ? '#241f3a' : '#19152b';
    ctx.lineWidth = 9.6 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY + 4 * scale);
    ctx.lineTo(oppArmIK.joint.x, oppArmIK.joint.y);
    ctx.lineTo(oppArmIK.end.x, oppArmIK.end.y);
    ctx.stroke();

    ctx.fillStyle = skinDark;
    ctx.beginPath();
    ctx.arc(oppArmIK.end.x, oppArmIK.end.y, 4.5 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Front leg
    drawLeg(0, false);

    // Torso
    ctx.save();
    ctx.translate(hipX, hipY);
    ctx.rotate(leanAngle);

    const jacketGrad = ctx.createLinearGradient(-18 * scale, -torsoLen, 18 * scale, 4 * scale);
    if (light) {
      jacketGrad.addColorStop(0, '#493f75');
      jacketGrad.addColorStop(0.55, '#312a4f');
      jacketGrad.addColorStop(1, '#221c38');
    } else {
      jacketGrad.addColorStop(0, '#362d59');
      jacketGrad.addColorStop(0.55, '#231d3b');
      jacketGrad.addColorStop(1, '#161226');
    }

    ctx.fillStyle = jacketGrad;
    ctx.beginPath();
    ctx.moveTo(-11.5 * scale, 3 * scale);
    ctx.lineTo(-16.5 * scale, -torsoLen + 4 * scale);
    ctx.quadraticCurveTo(0, -torsoLen - 4.5 * scale, 16.5 * scale, -torsoLen + 4 * scale);
    ctx.lineTo(11.5 * scale, 3 * scale);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = light ? 'rgba(255, 255, 255, 0.34)' : 'rgba(196, 181, 253, 0.22)';
    ctx.lineWidth = 1.25 * scale;
    ctx.stroke();

    ctx.restore();

    // Head & neck looking toward rope grip
    const neckTopX = shoulderX + Math.sin(leanAngle) * neckLen;
    const neckTopY = shoulderY - Math.cos(leanAngle) * neckLen;
    const headX = neckTopX + Math.sin(leanAngle) * (headR * 0.32);
    const headY = neckTopY - headR * 0.55;

    const toGrip = Math.atan2(gripPos.y - headY, gripPos.x - headX);
    const headTilt = lerp(
      walkBlend * Math.sin(walkPhase) * 0.04,
      clamp(toGrip * 0.36, -0.58, 0.22),
      reachBlend
    );

    ctx.strokeStyle = skinMid;
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY + 1 * scale);
    ctx.lineTo(neckTopX, neckTopY);
    ctx.stroke();

    ctx.save();
    ctx.translate(headX, headY);
    ctx.rotate(headTilt);

    const headGrad = ctx.createRadialGradient(-headR * 0.25, -headR * 0.35, headR * 0.15, 0, 0, headR * 1.05);
    headGrad.addColorStop(0, skinLit);
    headGrad.addColorStop(0.65, skinMid);
    headGrad.addColorStop(1, skinDark);

    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, headR * 0.88, headR, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = skinLit;
    ctx.beginPath();
    ctx.moveTo(headR * 0.82, -1.5 * scale);
    ctx.lineTo(headR * 1.15, 3.2 * scale);
    ctx.lineTo(headR * 0.82, 5.2 * scale);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = skinDark;
    ctx.beginPath();
    ctx.ellipse(-headR * 0.24, headR * 0.08, headR * 0.16, headR * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hairCol;
    ctx.beginPath();
    ctx.arc(-1 * scale, -2.5 * scale, headR * 0.95, Math.PI * 0.86, Math.PI * 2.05);
    ctx.quadraticCurveTo(headR * 0.68, -headR * 0.56, headR * 0.74, -headR * 0.24);
    ctx.quadraticCurveTo(0, -headR * 0.68, -headR * 0.88, -headR * 0.12);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // Right arm reaching & pulling gripPos via IK
    const shoulderPivot = {
      x: shoulderX + 5 * scale,
      y: shoulderY + 3 * scale
    };

    const restHand = {
      x: shoulderPivot.x + Math.sin(walkPhase) * 14 * scale * walkBlend,
      y: shoulderPivot.y + (upperArmLen + foreArmLen) * 0.86
    };

    const handGoal = {
      x: lerp(restHand.x, gripPos.x, reachBlend),
      y: lerp(restHand.y, gripPos.y, reachBlend)
    };

    const reachIK = solveTwoBone(shoulderPivot, handGoal, upperArmLen, foreArmLen, -1);

    ctx.strokeStyle = light ? '#39305c' : '#282142';
    ctx.lineWidth = 10.6 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulderPivot.x, shoulderPivot.y);
    ctx.lineTo(reachIK.joint.x, reachIK.joint.y);
    ctx.stroke();

    ctx.strokeStyle = skinLit;
    ctx.lineWidth = 8.4 * scale;
    ctx.beginPath();
    ctx.moveTo(reachIK.joint.x, reachIK.joint.y);
    ctx.lineTo(reachIK.end.x, reachIK.end.y);
    ctx.stroke();

    ctx.fillStyle = skinLit;
    ctx.beginPath();
    ctx.arc(reachIK.end.x, reachIK.end.y, 5.4 * scale, 0, Math.PI * 2);
    ctx.fill();

    if (reachBlend > 0.5) {
      const alpha = clamp((reachBlend - 0.5) / 0.5, 0, 1);
      ctx.strokeStyle = `rgba(133, 80, 51, ${alpha * 0.85})`;
      ctx.lineWidth = 2.1 * scale;
      ctx.beginPath();
      ctx.arc(gripPos.x, gripPos.y, 7.2 * scale, -0.35, 1.55);
      ctx.stroke();
    }

    ctx.restore();
  }

  function updateBranding(now) {
    const t = clamp((now - startTime) / (prefersReduced ? 1 : 850), 0, 1);
    const e = easeOutCubic(t);

    if (brandEl) {
      brandEl.style.opacity = String(e);
      brandEl.style.transform = `translateY(${(1 - e) * 14}px) scale(${0.96 + e * 0.04})`;
      brandEl.style.filter = `blur(${(1 - e) * 8}px)`;
    }

    letters.forEach((span, idx) => {
      const lt = clamp((now - startTime - (prefersReduced ? 0 : 120 + idx * 28)) / (prefersReduced ? 1 : 420), 0, 1);
      const le = easeOutCubic(lt);
      span.style.opacity = String(le);
      span.style.transform = `translateY(${(1 - le) * 12}px)`;
      span.style.filter = `blur(${(1 - le) * 5}px)`;
    });

    const subT = clamp((now - startTime - (prefersReduced ? 0 : 360)) / (prefersReduced ? 1 : 400), 0, 1);
    if (subEl) {
      subEl.style.opacity = String(easeOutCubic(subT));
      subEl.style.transform = `translateY(${(1 - easeOutCubic(subT)) * 8}px)`;
    }

    const progT = clamp((now - startTime - (prefersReduced ? 0 : 500)) / (prefersReduced ? 1 : 380), 0, 1);
    if (progressEl) {
      progressEl.style.opacity = String(easeOutCubic(progT));
      progressEl.style.transform = `translateY(${(1 - easeOutCubic(progT)) * 8}px)`;
    }
  }

  function setProgressUI(val) {
    const pct = Math.round(clamp(val, 0, 100));
    if (fillEl) fillEl.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%';
    if (srEl) srEl.textContent = `Loading ThemeHaven ${pct} percent`;
    if (stateEl) {
      if (curtainStarted) stateEl.textContent = 'Opening';
      else if (pct >= 90) stateEl.textContent = 'Pulling Rope';
      else stateEl.textContent = 'Loading';
    }
  }

  function computeMotion(now, layout) {
    const elapsed = now - startTime;
    const { standX, scale } = layout;

    const startX = -78 * scale;
    const walkMs = prefersReduced ? 1 : 1500;
    const reachStart = walkMs;
    const reachMs = prefersReduced ? 1 : 550;
    const pullStart = reachStart + reachMs;
    const pullMs = prefersReduced ? 1 : 500;
    const pullDoneAt = pullStart + pullMs;

    let hipX = standX;
    let walkBlend = 0;
    let walkPhase = 0;
    let reachBlend = 0;
    let pullBlend = 0;

    if (elapsed < walkMs) {
      const t = clamp(elapsed / walkMs, 0, 1);
      hipX = lerp(startX, standX, easeInOutCubic(t));
      walkBlend = 1 - Math.pow(t, 4);
      walkPhase = elapsed * 0.0115;
    } else if (elapsed < pullStart) {
      hipX = standX;
      walkBlend = 0;
      const t = clamp((elapsed - reachStart) / reachMs, 0, 1);
      reachBlend = easeOutCubic(t);
    } else if (elapsed < pullDoneAt) {
      hipX = standX;
      walkBlend = 0;
      reachBlend = 1;
      const t = clamp((elapsed - pullStart) / pullMs, 0, 1);
      pullBlend = easeInOutCubic(t);
    } else {
      hipX = standX;
      walkBlend = 0;
      reachBlend = 1;
      pullBlend = 1;
    }

    ropePullDown = pullBlend * (42 * scale);
    ropePullLeft = -pullBlend * (8 * scale);

    return {
      hipX,
      walkBlend,
      walkPhase,
      reachBlend,
      pullBlend,
      pullDone: elapsed >= pullDoneAt
    };
  }

  function startCurtain(now) {
    if (curtainStarted) return;
    curtainStarted = true;
    curtainStartAt = now;
    sessionStorage.setItem('th-loader-seen', '1');
  }

  function applyCurtain(now) {
    const dur = prefersReduced ? 260 : 1100;
    const t = clamp((now - curtainStartAt) / dur, 0, 1);
    const e = easeInOutQuint(t);

    if (drapeLeft) {
      drapeLeft.style.transform = `translate3d(${(-e * 100).toFixed(2)}%, 0, 0)`;
    }
    if (drapeRight) {
      drapeRight.style.transform = `translate3d(${(e * 100).toFixed(2)}%, 0, 0)`;
    }

    const fade = clamp(1 - t * 1.4, 0, 1);
    if (heroEl) {
      heroEl.style.opacity = String(fade);
      heroEl.style.transform = `translateY(${(-24 - e * 14).toFixed(1)}px) scale(${(1 - e * 0.03).toFixed(3)})`;
      heroEl.style.filter = `blur(${(e * 6).toFixed(1)}px)`;
    }
    if (canvas) {
      canvas.style.opacity = String(fade);
    }

    if (t >= 1) {
      destroyLoader();
    }
  }

  function destroyLoader() {
    if (disposed) return;
    disposed = true;
    if (rafId) cancelAnimationFrame(rafId);
    window.removeEventListener('resize', resize);
    window.removeEventListener('load', onReady);
    window.removeEventListener('pageshow', onShow);
    loader.classList.add('is-done');
    root.classList.remove('th-loader-active');
    setTimeout(() => {
      if (loader && loader.parentNode) loader.remove();
    }, 50);
  }

  function onReady() {
    pageLoaded = true;
  }

  function onShow(e) {
    if (e.persisted) destroyLoader();
  }

  function loop(now) {
    if (disposed) return;

    const layout = getLayout();
    const motion = computeMotion(now, layout);

    updateBranding(now);

    const elapsed = now - startTime;
    const cap = pageLoaded ? 100 : 88;
    const paced = Math.min(cap, (elapsed / (prefersReduced ? 200 : 2450)) * 94);
    targetProgress = Math.max(targetProgress, paced);
    if (pageLoaded && motion.pullDone) targetProgress = 100;

    visualProgress += (targetProgress - visualProgress) * (prefersReduced ? 1 : 0.1);
    if (pageLoaded && motion.pullDone && 100 - visualProgress < 0.35) {
      visualProgress = 100;
    }
    setProgressUI(visualProgress);

    if (ctx) {
      ctx.clearRect(0, 0, width, height);
      drawFloor(layout);
      const { gripPos } = drawRope(layout, now);
      drawHuman(layout, gripPos, motion);
    }

    if (!curtainStarted && pageLoaded && motion.pullDone && visualProgress >= 99.6) {
      startCurtain(now);
    }

    if (curtainStarted) {
      applyCurtain(now);
    }

    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('pageshow', onShow);

  if (document.readyState === 'complete') {
    pageLoaded = true;
  } else {
    window.addEventListener('load', onReady, { once: true });
  }

  resize();
  setProgressUI(0);
  startTime = performance.now();

  if (prefersReduced) {
    if (brandEl) {
      brandEl.style.opacity = '1';
      brandEl.style.transform = 'none';
      brandEl.style.filter = 'none';
    }
    letters.forEach((el) => {
      el.style.opacity = '1';
      el.style.transform = 'none';
      el.style.filter = 'none';
    });
    if (subEl) {
      subEl.style.opacity = '1';
      subEl.style.transform = 'none';
    }
    if (progressEl) {
      progressEl.style.opacity = '1';
      progressEl.style.transform = 'none';
    }
  }

  rafId = requestAnimationFrame(loop);

  setTimeout(() => {
    pageLoaded = true;
    if (!curtainStarted) {
      startCurtain(performance.now());
    }
  }, 5500);
})();
</script>
